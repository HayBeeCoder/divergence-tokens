{
    "workerPoolSpecs": [
      {
        "machineSpec": {
          "machineType": "g2-standard-8",
          "acceleratorType": "NVIDIA_L4",
          "acceleratorCount": 1
        },
        "replicaCount": "1",
        "diskSpec": {
          "bootDiskType": "pd-ssd",
          "bootDiskSizeGb": 500
        },
        "containerSpec": {
          "imageUri": "gcr.io/abasso-project/sl-training:v5",
          "command": ["bash", "-c"],
          "args": ["bash run_phase_5_with_logging.sh"],
          "env": [
            { "name": "GCS_BUCKET", "value": "gs://multi-hop-experiment" },
            { "name": "SMOKE_TEST", "value": "0" },
            { "name": "RUN_EVALS", "value": "1" }
          ]
        }
      }
    ]
}
